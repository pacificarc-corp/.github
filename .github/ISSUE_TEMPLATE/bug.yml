name: "🐞 Bug"
description: "Report something that isn't working"
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear, concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to Reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: Include error messages, logs, or screenshots.
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Branch/commit, browser/OS, env (local/staging/prod), affected site.
      value: |
        - Branch/commit:
        - Environment:
        - Browser/OS:
    validations:
      required: false
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - "Blocker — system unusable"
        - "High — major feature broken"
        - "Medium — workaround exists"
        - "Low — minor / cosmetic"
    validations:
      required: true
